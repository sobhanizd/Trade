# Production-style stack: PostgreSQL + migrations + web + worker (+ optional Caddy for HTTPS).
#   cp .env.example .env   # fill in secrets; set DATABASE_URL to use host "db"
#   docker compose up -d --build
#   docker compose run --rm worker npx tsx scripts/create-user.ts --email you@example.com
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryptopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cryptopilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptopilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cryptopilot:${POSTGRES_PASSWORD}@db:5432/cryptopilot
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cryptopilot:${POSTGRES_PASSWORD}@db:5432/cryptopilot
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]   # exposed to the host only; Caddy terminates HTTPS
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cryptopilot:${POSTGRES_PASSWORD}@db:5432/cryptopilot
      NODE_ENV: production
    depends_on: { migrate: { condition: service_completed_successfully } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]   # enable with: docker compose --profile https up -d
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
